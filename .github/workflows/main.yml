name: Release CI
on:
  push:
    tags: ['v*']
    branches: ['master', 'main']
  workflow_dispatch:

jobs:

  x64_build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
      
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Install MFC libraries
      shell: pwsh
      run: |
        Write-Host "Installing MFC libraries..."
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
        Write-Host "Visual Studio path: $vsPath"
        $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
        if (Test-Path $installer) {
            Write-Host "Running VS Installer to add MFC component..."
            $proc = Start-Process -FilePath $installer -ArgumentList "modify","--installPath","`"$vsPath`"","--add","Microsoft.VisualStudio.Component.VC.MFC.x86.x64","--add","Microsoft.VisualStudio.Component.VC.ATL.x86.x64","--quiet","--norestart" -PassThru -Wait
            Write-Host "Installer exit code: $($proc.ExitCode)"
        } else {
            Write-Host "VS Installer not found at $installer"
            exit 1
        }
        Write-Host "MFC installation complete."

    - name: Run msbuild
      run: msbuild TrafficMonitor_Lite.sln -p:configuration="Release (lite)" -p:platform=x64 -p:platformToolset=v143
      
    - name: Get current time
      uses: josStorer/get-current-time@v2.0.2
      id: current-time
      with:
        format: YYYYMMDD_HHmmss
        utcOffset: "+08:00"
      
    - name : Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: x64_${{ steps.current-time.outputs.formattedTime }}_TrafficMonitor
        path: |
          Bin/x64/Release (lite)/TrafficMonitor.exe
          Bin/x64/Release (lite)/*.dll

    - name : Upload pdb files
      uses: actions/upload-artifact@v4
      with:
        name: x64_${{ steps.current-time.outputs.formattedTime }}_pdb
        path: Bin/x64/Release (lite)/*.pdb

  x86_build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
      
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Install MFC libraries
      shell: pwsh
      run: |
        Write-Host "Installing MFC libraries..."
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
        Write-Host "Visual Studio path: $vsPath"
        $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
        if (Test-Path $installer) {
            Write-Host "Running VS Installer to add MFC component..."
            $proc = Start-Process -FilePath $installer -ArgumentList "modify","--installPath","`"$vsPath`"","--add","Microsoft.VisualStudio.Component.VC.MFC.x86.x64","--add","Microsoft.VisualStudio.Component.VC.ATL.x86.x64","--quiet","--norestart" -PassThru -Wait
            Write-Host "Installer exit code: $($proc.ExitCode)"
        } else {
            Write-Host "VS Installer not found at $installer"
            exit 1
        }
        Write-Host "MFC installation complete."

    - name: Run msbuild
      run: msbuild TrafficMonitor_Lite.sln -p:configuration="Release (lite)" -p:platform=x86 -p:platformToolset=v143
      
    - name: Get current time
      uses: josStorer/get-current-time@v2.0.2
      id: current-time
      with:
        format: YYYYMMDD_HHmmss
        utcOffset: "+08:00"
      
    - name : Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: x86_${{ steps.current-time.outputs.formattedTime }}_TrafficMonitor
        path: |
          Bin/Release (lite)/TrafficMonitor.exe
          Bin/Release (lite)/*.dll
      
    - name : Upload pdb files
      uses: actions/upload-artifact@v4
      with:
        name: x86_${{ steps.current-time.outputs.formattedTime }}_pdb
        path: Bin/Release (lite)/*.pdb
