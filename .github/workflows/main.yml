    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Install MFC libraries
      shell: pwsh
      run: |
        Write-Host "Checking for MFC libraries..."
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
        Write-Host "Visual Studio path: $vsPath"
        $mfcPath = Join-Path $vsPath "VC\Tools\MSVC"
        $mfcInstalled = $false
        if (Test-Path $mfcPath) {
            Get-ChildItem $mfcPath | ForEach-Object {
                $atlmfcPath = Join-Path $_.FullName "atlmfc"
                if (Test-Path $atlmfcPath) { $mfcInstalled = $true }
            }
        }
        if ($mfcInstalled) {
            Write-Host "MFC is already installed."
        } else {
            Write-Host "MFC not found. Installing..."
            $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
            if (Test-Path $installer) {
                Write-Host "Running VS Installer to add MFC component (with --wait)..."
                & $installer modify --installPath "$vsPath" --add Microsoft.VisualStudio.Component.VC.MFC.x86.x64 --add Microsoft.VisualStudio.Component.VC.ATL.x86.x64 --quiet --norestart --wait --nocache
                Write-Host "Installer exit code: $LASTEXITCODE"
            }
        }
        Write-Host "MFC step complete."

    - name: Run msbuild
      run: msbuild TrafficMonitor_Lite.sln -p:configuration="Release (lite)" -p:platform=x86 -p:platformToolset=v143

    - name: Copy runtime resources to output
      shell: pwsh
      run: |
        $outDir = "Bin\Release (lite)"
        if (Test-Path "TrafficMonitor\skins") {
          Copy-Item -Path "TrafficMonitor\skins" -Destination $outDir -Recurse -Force
        }
        if (Test-Path "TrafficMonitor\language") {
          Copy-Item -Path "TrafficMonitor\language" -Destination $outDir -Recurse -Force
        }
        if (Test-Path "OpenHardwareMonitorApi\LibreHardwareMonitorLib.dll") {
          Copy-Item -Path "OpenHardwareMonitorApi\LibreHardwareMonitorLib.dll" -Destination $outDir -Force
        }
        Write-Host "Runtime resources copied to $outDir"

    - name: Get current time
      uses: josStorer/get-current-time@v2.0.2
      id: current-time
      with:
        format: YYYYMMDD_HHmmss
        utcOffset: "+08:00"

    - name: Create portable zip
      shell: pwsh
      run: |
        $outDir = "Bin\Release (lite)"
        $zipName = "TrafficMonitor_x86_${{ steps.current-time.outputs.formattedTime }}.zip"
        Compress-Archive -Path "$outDir\*" -DestinationPath $zipName -Force
        Write-Host "Created $zipName"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: x86_${{ steps.current-time.outputs.formattedTime }}_TrafficMonitor
        path: Bin/Release (lite)/*

    - name: Upload portable zip
      uses: actions/upload-artifact@v4
      with:
        name: x86_${{ steps.current-time.outputs.formattedTime }}_TrafficMonitor_zip
        path: TrafficMonitor_x86_${{ steps.current-time.outputs.formattedTime }}.zip
