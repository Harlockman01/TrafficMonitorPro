name: Release CI
on:
  push:
    tags: ['v*']
    branches: ['master', 'main']
  workflow_dispatch:

jobs:

  x64_build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v3
      
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Install MFC libraries
      shell: pwsh
      run: |
        Write-Host "Checking for MFC libraries..."
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
        Write-Host "Visual Studio path: $vsPath"
        # Check if MFC is already installed
        $mfcPath = Join-Path $vsPath "VC\Tools\MSVC"
        $mfcInstalled = $false
        if (Test-Path $mfcPath) {
            Get-ChildItem $mfcPath | ForEach-Object {
                $atlmfcPath = Join-Path $_.FullName "atlmfc"
                if (Test-Path $atlmfcPath) { $mfcInstalled = $true }
            }
        }
        if ($mfcInstalled) {
            Write-Host "MFC is already installed."
        } else {
            Write-Host "MFC not found. Installing..."
            $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
            if (Test-Path $installer) {
                Write-Host "Running VS Installer to add MFC component (with --wait)..."
                & $installer modify --installPath "$vsPath" --add Microsoft.VisualStudio.Component.VC.MFC.x86.x64 --add Microsoft.VisualStudio.Component.VC.ATL.x86.x64 --quiet --norestart --wait --nocache
                Write-Host "Installer exit code: $LASTEXITCODE"
            } else {
                Write-Host "VS Installer not found. Trying setup.exe..."
                $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
                & $setup modify --installPath "$vsPath" --add Microsoft.VisualStudio.Component.VC.MFC.x86.x64 --add Microsoft.VisualStudio.Component.VC.ATL.x86.x64 --quiet --norestart --wait
                Write-Host "Setup exit code: $LASTEXITCODE"
            }
        }
        Write-Host "MFC step complete."

    - name: Run msbuild
      run: msbuild TrafficMonitor_Lite.sln -p:configuration="Release (lite)" -p:platform=x64 -p:platformToolset=v143
      
    - name: Get current time
      uses: josStorer/get-current-time@v2.0.2
      id: current-time
      with:
        format: YYYYMMDD_HHmmss
        utcOffset: "+08:00"
      
    - name : Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: x64_${{ steps.current-time.outputs.formattedTime }}_TrafficMonitor
        path: |
          Bin/x64/Release (lite)/TrafficMonitor.exe
          Bin/x64/Release (lite)/*.dll

    - name : Upload pdb files
      uses: actions/upload-artifact@v4
      with:
        name: x64_${{ steps.current-time.outputs.formattedTime }}_pdb
        path: Bin/x64/Release (lite)/*.pdb

  x86_build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v3
      
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Install MFC libraries
      shell: pwsh
      run: |
        Write-Host "Checking for MFC libraries..."
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
        Write-Host "Visual Studio path: $vsPath"
        $mfcPath = Join-Path $vsPath "VC\Tools\MSVC"
        $mfcInstalled = $false
        if (Test-Path $mfcPath) {
            Get-ChildItem $mfcPath | ForEach-Object {
                $atlmfcPath = Join-Path $_.FullName "atlmfc"
                if (Test-Path $atlmfcPath) { $mfcInstalled = $true }
            }
        }
        if ($mfcInstalled) {
            Write-Host "MFC is already installed."
        } else {
            Write-Host "MFC not found. Installing..."
            $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
            if (Test-Path $installer) {
                Write-Host "Running VS Installer to add MFC component (with --wait)..."
                & $installer modify --installPath "$vsPath" --add Microsoft.VisualStudio.Component.VC.MFC.x86.x64 --add Microsoft.VisualStudio.Component.VC.ATL.x86.x64 --quiet --norestart --wait --nocache
                Write-Host "Installer exit code: $LASTEXITCODE"
            } else {
                Write-Host "VS Installer not found. Trying setup.exe..."
                $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
                & $setup modify --installPath "$vsPath" --add Microsoft.VisualStudio.Component.VC.MFC.x86.x64 --add Microsoft.VisualStudio.Component.VC.ATL.x86.x64 --quiet --norestart --wait
                Write-Host "Setup exit code: $LASTEXITCODE"
            }
        }
        Write-Host "MFC step complete."

    - name: Run msbuild
      run: msbuild TrafficMonitor_Lite.sln -p:configuration="Release (lite)" -p:platform=x86 -p:platformToolset=v143
      
    - name: Get current time
      uses: josStorer/get-current-time@v2.0.2
      id: current-time
      with:
        format: YYYYMMDD_HHmmss
        utcOffset: "+08:00"
      
    - name : Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: x86_${{ steps.current-time.outputs.formattedTime }}_TrafficMonitor
        path: |
          Bin/Release (lite)/TrafficMonitor.exe
          Bin/Release (lite)/*.dll
      
    - name : Upload pdb files
      uses: actions/upload-artifact@v4
      with:
        name: x86_${{ steps.current-time.outputs.formattedTime }}_pdb
        path: Bin/Release (lite)/*.pdb
